# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR

tone_instructions: >
  주니어 개발자도 한 번에 이해하도록 쉬운 한국어로 결론부터 쓰세요. 영어 용어와 번역체를
  피하고, 실제 변경 라인, 발생 조건, 사용자 영향을 설명하세요. 근거 없는 제안과 스타일
  의견은 남기지 마세요.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: '.ai/RULES.md'
        applyTo: '**/*'
      - files: '.ai/CONVENTIONS.md'
        applyTo: '**/*'
      - files: 'docs/architecture.md'
        applyTo: '{web,app,admin,maeil-mail,shared}/**/*'
      - files: '.ai/review/REVIEW.md'
        applyTo: '**/*'
      - files: '.ai/review/false-positives.md'
        applyTo: '{web,admin,maeil-mail}/**/*'

reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - 'dev'
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - 'WIP'
      - '[skip review]'
  path_filters:
    - '!**/*.gen.ts'
    - '!**/*.generated.*'
    - '!**/openapi.d.ts'
    - '!**/generated/**'
    - '!**/pnpm-lock.yaml'
    - '!**/*.lock'
